<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Benjamin Yi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = 'dark'; // site defaults to dark; toggle preference persists
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <main>
    <section class="hero">
      <p class="eyebrow mono"><span class="pulse" aria-hidden="true"></span> INCIDENT REPORT</p>
      <h1 class="hero__name">404</h1>
      <p class="hero__tag">This page suffered a total loss.</p>
      <p class="lede">Whatever stood here couldn't be restored. The rest of the site is in pre-loss condition.</p>
      <div class="hero__cta">
        <a class="btn" href="/">Back to safety <span aria-hidden="true">→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
